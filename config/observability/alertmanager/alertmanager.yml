# Alertmanager configuration for the local observability stack.
#
# Placeholders wrapped in ${ALERTMANAGER_...} are substituted at startup by entrypoint.sh
# (Alertmanager has no env expansion of its own). The defaults shipped in '.env.example' point at
# 'smtp.gmail.com:587' with dummy credentials so the service starts cleanly even before a real
# Gmail App Password is provisioned; SMTP auth failures are expected in that case and surface as
# warnings in the Alertmanager log.
#
# To switch from dummy to real Gmail delivery, set in '.env' (or your shell):
#   ALERTMANAGER_SMTP_USER=<your-gmail-account>
#   ALERTMANAGER_SMTP_PASSWORD=<your-Google-App-Password>     # 2FA + App Password required
#   ALERTMANAGER_SMTP_FROM=<your-gmail-account>               # Gmail enforces From == auth user
#   ALERTMANAGER_EMAIL_TO=<recipient-address>
#
# Dead-man's switch for the alerting pipeline itself: set ALERTMANAGER_WATCHDOG_URL to the ping URL
# of an external heartbeat check (healthchecks.io, Better Stack, ...). entrypoint.sh then routes the
# always-firing Watchdog alert there every 5 minutes; the external service notifies you when the
# pings stop. Unset, Watchdog goes to the "null" receiver.

global:
  resolve_timeout: 5m
  smtp_smarthost: '${ALERTMANAGER_SMTP_HOST}:${ALERTMANAGER_SMTP_PORT}'
  smtp_from: '${ALERTMANAGER_SMTP_FROM}'
  smtp_auth_username: '${ALERTMANAGER_SMTP_USER}'
  smtp_auth_password: '${ALERTMANAGER_SMTP_PASSWORD}'
  smtp_require_tls: true

route:
  receiver: email-default
  group_by:
    - alertname
    - service
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Heartbeat: always firing by design. entrypoint.sh resolves the receiver: "watchdog-heartbeat"
    # when ALERTMANAGER_WATCHDOG_URL is set, otherwise "null". Re-sent every 5 minutes so the
    # external check (period 5m, grace 10m) sees a steady ping. See docs/runbooks/alerts.md#watchdog.
    - matchers:
        - alertname = "Watchdog"
      receiver: "${ALERTMANAGER_WATCHDOG_RECEIVER}"
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 5m
    # Critical alerts page faster and repeat every hour until resolved.
    - matchers:
        - severity = "critical"
      receiver: email-critical
      group_wait: 0s
      repeat_interval: 1h

# When the whole service is down every other alert for it (5xx, latency, outbox...) is noise:
# inhibit warnings while BackendFunerariaAppDown fires for the same service.
inhibit_rules:
  - source_matchers:
      - alertname = "BackendFunerariaAppDown"
    target_matchers:
      - severity = "warning"
    equal:
      - service
  # A critical alert supersedes a warning with the same name.
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal:
      - alertname
      - service

receivers:
  - name: "null"
  # Pings the external heartbeat service. The URL is a secret (anyone holding it can keep the check
  # green), so it only lives in .env. send_resolved is off: Watchdog never resolves on purpose.
  - name: watchdog-heartbeat
    webhook_configs:
      - url: '${ALERTMANAGER_WATCHDOG_URL}'
        send_resolved: false
        timeout: 10s
  - name: email-critical
    email_configs:
      - to: '${ALERTMANAGER_EMAIL_TO}'
        send_resolved: true
        headers:
          Subject: '[backend-funeraria][CRITICAL][{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        html: '{{ range .Alerts }}<p><b>{{ .Annotations.summary }}</b><br>{{ .Annotations.description }}<br><a href="{{ .Annotations.runbook_url }}">Runbook</a></p>{{ end }}'
  - name: email-default
    email_configs:
      - to: '${ALERTMANAGER_EMAIL_TO}'
        send_resolved: true
        headers:
          Subject: '[backend-funeraria][{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        html: '{{ range .Alerts }}<p><b>{{ .Annotations.summary }}</b><br>{{ .Annotations.description }}<br><a href="{{ .Annotations.runbook_url }}">Runbook</a></p>{{ end }}'
