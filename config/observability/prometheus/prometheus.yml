global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: backend-funeraria-app

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: backend-funeraria-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - app:8082

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

  # Backup freshness/outcome from the db-backup textfile, exposed by Grafana Alloy.
  - job_name: db-backup
    metrics_path: /api/v0/component/prometheus.exporter.unix.backups/metrics
    static_configs:
      - targets:
          - alloy:12345
