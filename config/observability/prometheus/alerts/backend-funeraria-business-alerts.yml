# Business and background-job alerts. The technical HTTP/JVM/pool alerts live in
# backend-funeraria-alerts.yml; this file covers the failure modes that would otherwise only
# show up as a log line: a stuck outbox relay, dead-lettered events, a nightly retention sweep
# that stopped succeeding, brute-force login attempts and GC pressure.
#
# Every alert carries a runbook_url pointing at docs/runbooks/alerts.md.

groups:
  - name: backend-funeraria-business
    interval: 30s
    rules:
      # The relay drains every few seconds; a PENDING row older than 5 minutes means it stopped
      # (scheduler dead, DB lock, consumer throwing on every batch). Notifications and the
      # activity feed depend on it.
      - alert: BackendFunerariaOutboxStalled
        expr: max(outbox_oldest_pending_age_seconds{job="backend-funeraria-app"}) > 300
        for: 5m
        labels:
          severity: critical
          service: backend-funeraria-app
        annotations:
          summary: Outbox relay is not draining
          description: The oldest PENDING outbox event is {{ $value | humanizeDuration }} old.
          runbook_url: https://github.com/andinogabriel/backend-funeraria-app/blob/master/docs/runbooks/alerts.md#outbox-stalled

      - alert: BackendFunerariaOutboxFailedEvents
        expr: max(outbox_events{job="backend-funeraria-app",status="failed"}) > 0
        for: 1m
        labels:
          severity: warning
          service: backend-funeraria-app
        annotations:
          summary: Outbox has dead-lettered events
          description: "{{ $value }} outbox events are in FAILED and will not be retried."
          runbook_url: https://github.com/andinogabriel/backend-funeraria-app/blob/master/docs/runbooks/alerts.md#outbox-failed-events

      - alert: BackendFunerariaOutboxBacklogHigh
        expr: max(outbox_events{job="backend-funeraria-app",status="pending"}) > 500
        for: 10m
        labels:
          severity: warning
          service: backend-funeraria-app
        annotations:
          summary: Outbox backlog is growing
          description: "{{ $value }} events are waiting to be relayed."
          runbook_url: https://github.com/andinogabriel/backend-funeraria-app/blob/master/docs/runbooks/alerts.md#outbox-backlog-high

      - alert: BackendFunerariaRetentionFailed
        expr: increase(retention_runs_total{job="backend-funeraria-app",outcome="failure"}[1d]) > 0
        labels:
          severity: warning
          service: backend-funeraria-app
        annotations:
          summary: Retention sweep failed
          description: The nightly retention sweep failed at least once in the last 24 hours.
          runbook_url: https://github.com/andinogabriel/backend-funeraria-app/blob/master/docs/runbooks/alerts.md#retention-failed

      # The last-success gauge restarts at 0 on every deploy, so a fresh process is only
      # considered stale once it has been up for longer than a full cycle (26 h) without a
      # successful run.
      - alert: BackendFunerariaRetentionStale
        expr: |
          (
            retention_last_success_timestamp_seconds{job="backend-funeraria-app"} > 0
            and
            time() - retention_last_success_timestamp_seconds{job="backend-funeraria-app"} > 93600
          )
          or
          (
            retention_last_success_timestamp_seconds{job="backend-funeraria-app"} == 0
            and on (instance)
            process_uptime_seconds{job="backend-funeraria-app"} > 93600
          )
        for: 15m
        labels:
          severity: warning
          service: backend-funeraria-app
        annotations:
          summary: Retention sweep has not succeeded for more than a day
          description: No successful retention sweep in the last 26 hours.
          runbook_url: https://github.com/andinogabriel/backend-funeraria-app/blob/master/docs/runbooks/alerts.md#retention-stale

      # LoginRateLimiter rejects locked-out attempts with HTTP 429; a sustained 429 rate on the
      # login endpoint is an active credential-stuffing / brute-force signal.
      - alert: BackendFunerariaLoginBruteForce
        expr: |
          sum(rate(http_server_requests_seconds_count{job="backend-funeraria-app",uri="/api/v1/users/login",status="429"}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          service: backend-funeraria-app
        annotations:
          summary: Login attempts are being rate-limited
          description: "{{ printf \"%.2f\" $value }} rejected login attempts per second over the last 5 minutes."
          runbook_url: https://github.com/andinogabriel/backend-funeraria-app/blob/master/docs/runbooks/alerts.md#login-brute-force

      - alert: BackendFunerariaAuthFailureSpike
        expr: |
          sum(rate(http_server_requests_seconds_count{job="backend-funeraria-app",status=~"401|403"}[5m])) > 1
        for: 10m
        labels:
          severity: warning
          service: backend-funeraria-app
        annotations:
          summary: Spike of 401/403 responses
          description: "{{ printf \"%.2f\" $value }} unauthorized/forbidden responses per second."
          runbook_url: https://github.com/andinogabriel/backend-funeraria-app/blob/master/docs/runbooks/alerts.md#auth-failure-spike

      # More than 10% of wall-clock time spent in GC pauses.
      - alert: BackendFunerariaGcPressure
        expr: sum(rate(jvm_gc_pause_seconds_sum{job="backend-funeraria-app"}[5m])) > 0.10
        for: 10m
        labels:
          severity: warning
          service: backend-funeraria-app
        annotations:
          summary: JVM is spending too much time in garbage collection
          description: "{{ $value | humanizePercentage }} of the time is spent in GC pauses."
          runbook_url: https://github.com/andinogabriel/backend-funeraria-app/blob/master/docs/runbooks/alerts.md#gc-pressure

  # Browser-side signals reported through /api/v1/client-telemetry (signed-in sessions only).
  - name: backend-funeraria-frontend
    interval: 1m
    rules:
      - alert: BackendFunerariaClientErrorSpike
        expr: sum(rate(client_errors_total{job="backend-funeraria-app"}[10m])) * 60 > 5
        for: 10m
        labels:
          severity: warning
          service: backend-funeraria-app
        annotations:
          summary: Frontend errors are spiking
          description: "{{ printf \"%.1f\" $value }} uncaught browser errors per minute."
          runbook_url: https://github.com/andinogabriel/backend-funeraria-app/blob/master/docs/runbooks/alerts.md#client-error-spike

      # Lazy bundles failing to load right after a deploy: open tabs are asking for chunk hashes
      # that no longer exist (usually index.html cached when it should not be).
      - alert: BackendFunerariaClientChunkLoadErrors
        expr: sum(increase(client_errors_total{job="backend-funeraria-app",kind="chunk-load"}[15m])) > 5
        labels:
          severity: warning
          service: backend-funeraria-app
        annotations:
          summary: Browsers fail to load application bundles
          description: "{{ printf \"%.0f\" $value }} chunk-load failures in the last 15 minutes."
          runbook_url: https://github.com/andinogabriel/backend-funeraria-app/blob/master/docs/runbooks/alerts.md#client-chunk-load-errors

      # p75 is the Core Web Vitals reporting convention; "poor" LCP starts at 4 s.
      - alert: BackendFunerariaPoorLcp
        expr: |
          histogram_quantile(0.75,
            sum by (le) (rate(client_web_vitals_duration_milliseconds_bucket{job="backend-funeraria-app",name="LCP"}[1h]))
          ) > 4000
        for: 1h
        labels:
          severity: warning
          service: backend-funeraria-app
        annotations:
          summary: Pages load slowly for users (LCP p75 is poor)
          description: "LCP p75 is {{ printf \"%.0f\" $value }} ms over the last hour (poor above 4000 ms)."
          runbook_url: https://github.com/andinogabriel/backend-funeraria-app/blob/master/docs/runbooks/alerts.md#poor-lcp

  # Nightly pg_dump (db-backup service), metrics exposed through Alloy's textfile collector.
  - name: backend-funeraria-backups
    interval: 1m
    rules:
      - alert: BackendFunerariaBackupFailed
        expr: max(backup_last_run_success{job="db-backup"}) == 0
        for: 5m
        labels:
          severity: critical
          service: backend-funeraria-app
        annotations:
          summary: Database backup failed
          description: The last pg_dump run failed; the newest restorable dump is older than expected.
          runbook_url: https://github.com/andinogabriel/backend-funeraria-app/blob/master/docs/runbooks/alerts.md#backup-failed

      # Daily schedule: more than 26 h without a successful dump means at least one missed night.
      - alert: BackendFunerariaBackupStale
        expr: time() - max(backup_last_success_timestamp_seconds{job="db-backup"}) > 93600
        for: 15m
        labels:
          severity: critical
          service: backend-funeraria-app
        annotations:
          summary: No successful database backup in the last 26 hours
          description: The newest successful dump is {{ $value | humanizeDuration }} old.
          runbook_url: https://github.com/andinogabriel/backend-funeraria-app/blob/master/docs/runbooks/alerts.md#backup-stale

      # The textfile disappeared or the db-backup service never ran: silence is not success.
      - alert: BackendFunerariaBackupMetricsMissing
        expr: absent(backup_last_run_timestamp_seconds{job="db-backup"})
        for: 30m
        labels:
          severity: warning
          service: backend-funeraria-app
        annotations:
          summary: Backup metrics are missing
          description: Prometheus sees no backup_last_run_timestamp_seconds; the db-backup service may not be running.
          runbook_url: https://github.com/andinogabriel/backend-funeraria-app/blob/master/docs/runbooks/alerts.md#backup-metrics-missing

      # Off-host copy (backup-offsite service). Hourly runs, so a few failed runs in a row are
      # tolerated (network blips) before paging.
      - alert: BackendFunerariaBackupOffsiteFailed
        expr: max(backup_offsite_last_run_success{job="db-backup"}) == 0
        for: 3h
        labels:
          severity: critical
          service: backend-funeraria-app
        annotations:
          summary: Off-host backup copy is failing
          description: The encrypted off-host copy has failed for three hours; the newest dumps exist only on this host.
          runbook_url: https://github.com/andinogabriel/backend-funeraria-app/blob/master/docs/runbooks/alerts.md#backup-offsite-failed

      # The newest dump confirmed off-host is older than a day plus margin: either uploads stopped
      # or no new dumps are being produced (BackupStale fires too in that case).
      - alert: BackendFunerariaBackupOffsiteStale
        # Age on the left side of `and` so $value in the description is the age, not the flag.
        expr: |
          time() - max(backup_offsite_newest_dump_timestamp_seconds{job="db-backup"}) > 100800
          and on()
          max(backup_offsite_enabled{job="db-backup"}) == 1
        for: 15m
        labels:
          severity: critical
          service: backend-funeraria-app
        annotations:
          summary: No recent backup off-host
          description: The newest dump stored off-host is {{ $value | humanizeDuration }} old.
          runbook_url: https://github.com/andinogabriel/backend-funeraria-app/blob/master/docs/runbooks/alerts.md#backup-offsite-stale

      # The backup-offsite container stopped running: no run recorded for three hours while the
      # copy is configured (runs are hourly). Much faster than waiting for OffsiteStale.
      - alert: BackendFunerariaBackupOffsiteNotRunning
        expr: |
          time() - max(backup_offsite_last_run_timestamp_seconds{job="db-backup"}) > 10800
          and on()
          max(backup_offsite_enabled{job="db-backup"}) == 1
        for: 15m
        labels:
          severity: warning
          service: backend-funeraria-app
        annotations:
          summary: Off-host backup job is not running
          description: The last off-host copy run was {{ $value | humanizeDuration }} ago; runs are hourly.
          runbook_url: https://github.com/andinogabriel/backend-funeraria-app/blob/master/docs/runbooks/alerts.md#backup-offsite-not-running

      # Off-host copy not configured: a disk or host loss would take every backup with it.
      - alert: BackendFunerariaBackupOffsiteDisabled
        expr: max(backup_offsite_enabled{job="db-backup"}) == 0
        for: 1h
        labels:
          severity: warning
          service: backend-funeraria-app
        annotations:
          summary: Backups are not copied off this host
          description: BACKUP_OFFSITE_REMOTE is not configured; all database backups live on the same host as the database.
          runbook_url: https://github.com/andinogabriel/backend-funeraria-app/blob/master/docs/runbooks/alerts.md#backup-offsite-disabled

  - name: backend-funeraria-meta
    rules:
      # Always firing. Its only purpose is to prove the Prometheus -> Alertmanager pipeline is
      # alive; route it to an external dead-man's-switch (see the runbook) so silence pages.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
          service: backend-funeraria-app
        annotations:
          summary: Alerting pipeline heartbeat
          description: This alert is always firing. If it stops, alerting itself is broken.
          runbook_url: https://github.com/andinogabriel/backend-funeraria-app/blob/master/docs/runbooks/alerts.md#watchdog
