groups:
  - name: backend-funeraria-app
    interval: 30s
    rules:
      - alert: BackendFunerariaAppDown
        expr: up{job="backend-funeraria-app"} == 0
        for: 1m
        labels:
          severity: critical
          service: backend-funeraria-app
        annotations:
          summary: Backend Funeraria App is down
          description: The monolith has not been scraped successfully for more than one minute.
          runbook_url: https://github.com/andinogabriel/backend-funeraria-app/blob/master/docs/runbooks/alerts.md#app-down

      - alert: BackendFunerariaHigh5xxRate
        expr: |
          sum(rate(http_server_requests_seconds_count{job="backend-funeraria-app",status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_requests_seconds_count{job="backend-funeraria-app"}[5m])), 1)
          > 0.05
        for: 5m
        labels:
          severity: warning
          service: backend-funeraria-app
        annotations:
          summary: High 5xx error ratio
          description: More than 5% of the recent HTTP traffic is failing with server-side errors.
          runbook_url: https://github.com/andinogabriel/backend-funeraria-app/blob/master/docs/runbooks/alerts.md#high-5xx-rate

      - alert: BackendFunerariaHighLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{job="backend-funeraria-app"}[5m]))
          ) > 1.5
        for: 10m
        labels:
          severity: warning
          service: backend-funeraria-app
        annotations:
          summary: High HTTP latency p95
          description: The 95th percentile latency has stayed above 1.5 seconds for ten minutes.
          runbook_url: https://github.com/andinogabriel/backend-funeraria-app/blob/master/docs/runbooks/alerts.md#high-latency-p95

      - alert: BackendFunerariaDatabasePoolPressure
        expr: |
          sum(hikaricp_connections_active{job="backend-funeraria-app"})
          /
          clamp_min(sum(hikaricp_connections_max{job="backend-funeraria-app"}), 1)
          > 0.80
        for: 10m
        labels:
          severity: warning
          service: backend-funeraria-app
        annotations:
          summary: High database connection pool pressure
          description: The Hikari connection pool has been above 80% utilization for ten minutes.
          runbook_url: https://github.com/andinogabriel/backend-funeraria-app/blob/master/docs/runbooks/alerts.md#db-pool-pressure

      - alert: BackendFunerariaHeapPressure
        expr: |
          sum(jvm_memory_used_bytes{job="backend-funeraria-app",area="heap"})
          /
          clamp_min(sum(jvm_memory_max_bytes{job="backend-funeraria-app",area="heap"}), 1)
          > 0.85
        for: 10m
        labels:
          severity: warning
          service: backend-funeraria-app
        annotations:
          summary: High JVM heap usage
          description: Heap usage has remained above 85% for ten minutes.
          runbook_url: https://github.com/andinogabriel/backend-funeraria-app/blob/master/docs/runbooks/alerts.md#heap-pressure

  # Tracing pipeline: app -> OTel Collector -> Tempo. Export is on by default (ADR-0018), so a
  # silent break here means traces are missing exactly when someone needs them for an incident.
  - name: backend-funeraria-tracing
    interval: 30s
    rules:
      - alert: BackendFunerariaTracingCollectorDown
        expr: up{job="otel-collector"} == 0
        for: 5m
        labels:
          severity: warning
          service: backend-funeraria-app
        annotations:
          summary: OpenTelemetry Collector is down
          description: The OTel Collector has not been scraped for five minutes; application spans are being dropped.
          runbook_url: https://github.com/andinogabriel/backend-funeraria-app/blob/master/docs/runbooks/alerts.md#tracing-collector-down

      - alert: BackendFunerariaTraceExportFailing
        expr: sum(rate(otelcol_exporter_send_failed_spans{job="otel-collector"}[5m])) > 0
        for: 10m
        labels:
          severity: warning
          service: backend-funeraria-app
        annotations:
          summary: Spans are failing to reach Tempo
          description: The collector has been failing to export spans to Tempo for ten minutes ({{ $value | humanize }} spans/s dropped).
          runbook_url: https://github.com/andinogabriel/backend-funeraria-app/blob/master/docs/runbooks/alerts.md#trace-export-failing

      - alert: BackendFunerariaTracesNotReceived
        # The app serves traffic but the collector accepts no spans: export switched off or the
        # app cannot reach the collector. `or vector(0)` covers a collector that never received a
        # span (the counter only appears after the first one).
        expr: |
          sum(rate(http_server_requests_seconds_count{job="backend-funeraria-app"}[15m])) > 0
          and on()
          (sum(rate(otelcol_receiver_accepted_spans{job="otel-collector"}[15m])) or on() vector(0)) == 0
        for: 15m
        labels:
          severity: warning
          service: backend-funeraria-app
        annotations:
          summary: Application traffic is producing no traces
          description: The app has handled requests for 15 minutes but the collector received no spans.
          runbook_url: https://github.com/andinogabriel/backend-funeraria-app/blob/master/docs/runbooks/alerts.md#traces-not-received
