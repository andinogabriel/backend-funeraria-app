# Grafana Loki for the local observability stack: single binary, filesystem storage, 7-day
# retention. Receives the application's JSON logs from Grafana Alloy.
#
# Labels stay low-cardinality (service, container, level). Per-request identifiers such as
# traceId and correlationId travel as structured metadata, so they are searchable and linkable
# from Tempo without exploding the number of streams.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
