apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      manageAlerts: true
      prometheusType: Prometheus
      timeInterval: 15s

  # Tempo stores the OTLP traces produced by the application and forwarded by the OTel Collector.
  # tracesToLogsV2 jumps from a span to the Loki log lines that share its traceId. traceId is Loki
  # structured metadata (not a label), so the custom query filters it with a pipe expression.
  # serviceMap enables the service graph view in Explore.
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        customQuery: true
        query: '{service="backend-funeraria-app"} | traceId = "$${__span.traceId}"'
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
      lokiSearch:
        datasourceUid: loki

  # Loki holds the application JSON logs shipped by Grafana Alloy. The derived field turns the
  # traceId structured-metadata field of a log line into a link that opens the trace in Tempo.
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: traceId
          matcherType: label
          matcherRegex: traceId
          datasourceUid: tempo
          url: '$${__value.raw}'
          urlDisplayLabel: Ver traza en Tempo
