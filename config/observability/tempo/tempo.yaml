# Grafana Tempo 3.x configuration for the local observability stack.
#
# Single-binary deployment using the local filesystem as the trace store. This is intentionally
# the smallest possible setup that still produces a working trace search UI in Grafana — there
# is no S3 backend, no clustering and no metrics-generator. The goal is to let a contributor
# running the observability profile follow a request from its log line to its trace without
# setting up cloud infrastructure first.
#
# Tempo 3 removed the `ingester` and `compactor` blocks of the 2.x layout; block retention now
# lives under `backend_worker.compaction`. The image is pinned in docker-compose.yml so a future
# major cannot break this file silently again.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

backend_worker:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
