services:
  postgres:
    image: postgres:17-alpine
    container_name: backend-funeraria-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-funerariadb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-funerariadb}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
    container_name: backend-funeraria-app
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker,json-logs
      SERVER_PORT: 8081
      MANAGEMENT_SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-funerariadb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # JJWT 0.13+ enforces RFC 7518 §3.2: HMAC-SHA keys MUST be >= the hash output size.
      # JwtProvider signs with HS512, so the minimum is 512 bits / 64 ASCII chars. Anything
      # shorter triggers WeakKeyException on the very first /users/login call. The previous
      # 51-char default looked safe but landed at 408 bits and crashed login regardless.
      # Keep this >= 64 chars (the validator enforces it at boot time too).
      JWT_TOKEN_SECRET: ${JWT_TOKEN_SECRET:-local-dev-jwt-secret-change-me-now-please-at-least-64-bytes-long-please}
      SECURITY_PASSWORD_PEPPER: ${SECURITY_PASSWORD_PEPPER:-local-dev-pepper}
      SECURITY_REQUEST_FINGERPRINT_SECRET: ${SECURITY_REQUEST_FINGERPRINT_SECRET:-local-dev-fingerprint-secret}
      APP_STORAGE_LOCAL_ROOT_PATH: /data/storage
      APP_STORAGE_LOCAL_PUBLIC_BASE_URL: ${APP_STORAGE_LOCAL_PUBLIC_BASE_URL:-http://localhost:8081/files/}
      APP_BOOTSTRAP_ADMIN_ENABLED: ${APP_BOOTSTRAP_ADMIN_ENABLED:-true}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-admin@funeraria.local}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-Admin123!}
      APP_BOOTSTRAP_ADMIN_FIRST_NAME: ${APP_BOOTSTRAP_ADMIN_FIRST_NAME:-Admin}
      APP_BOOTSTRAP_ADMIN_LAST_NAME: ${APP_BOOTSTRAP_ADMIN_LAST_NAME:-Funeraria}
      # Distributed tracing export. On by default: the OTel Collector is part of the base stack, so
      # the app always has an OTLP sink. Tempo/Grafana (where traces are stored and browsed) still
      # need `--profile observability`; without them the collector drops spans after its retry
      # window, never the app. Set MANAGEMENT_TRACING_EXPORT_ENABLED=false to switch export off.
      # The endpoint must never be empty (Spring Boot 4 fails at startup).
      MANAGEMENT_TRACING_EXPORT_ENABLED: ${MANAGEMENT_TRACING_EXPORT_ENABLED:-true}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:-http://otel-collector:4318/v1/traces}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:-1.0}
    ports:
      - "${SERVER_PORT:-8081}:8081"
      # Actuator (management port) is bound to the host loopback only: reachable for local
      # debugging and the k6 baseline, never exposed on the network interface.
      - "127.0.0.1:${MANAGEMENT_PORT:-8082}:8082"
    volumes:
      - app_storage:/data/storage

  # Nightly pg_dump of the application database (default profile: backups must not depend on the
  # observability stack being up). Dumps land in ./backups/daily (git-ignored), are integrity
  # checked with pg_restore --list, rotated (BACKUP_KEEP), and a Prometheus textfile in
  # ./backups/metrics feeds the backup alerts through Grafana Alloy. Verify restorability with
  # scripts/backup/restore-verify.sh. See docs/runbooks/retention-and-restore.md.
  db-backup:
    image: postgres:17-alpine
    container_name: backend-funeraria-db-backup
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/scheduler.sh"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-funerariadb}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      BACKUP_AT_UTC: ${BACKUP_AT_UTC:-05:00}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_ON_START: ${BACKUP_ON_START:-true}
    volumes:
      - ./config/backup:/scripts:ro
      - ./backups:/backups
    restart: unless-stopped

  # Off-host, encrypted copy of the dumps above (rclone crypt to any rclone remote: S3, B2, Google
  # Drive, SFTP...). Runs hourly, copies only new dumps, keeps BACKUP_OFFSITE_KEEP_DAYS remotely and
  # writes backup_offsite.prom for the alerts. With BACKUP_OFFSITE_REMOTE empty it only reports
  # itself as disabled. Restore: `docker compose run --rm backup-offsite fetch` then
  # scripts/backup/restore-verify.sh backups/restore/<file>. See docs/runbooks/retention-and-restore.md.
  backup-offsite:
    image: rclone/rclone:1.75.2
    container_name: backend-funeraria-backup-offsite
    entrypoint: ["/bin/sh", "/scripts/offsite.sh"]
    environment:
      BACKUP_OFFSITE_REMOTE: ${BACKUP_OFFSITE_REMOTE:-}
      BACKUP_OFFSITE_PASSPHRASE: ${BACKUP_OFFSITE_PASSPHRASE:-}
      BACKUP_OFFSITE_SALT: ${BACKUP_OFFSITE_SALT:-}
      BACKUP_OFFSITE_KEEP_DAYS: ${BACKUP_OFFSITE_KEEP_DAYS:-90}
      BACKUP_OFFSITE_INTERVAL_SECONDS: ${BACKUP_OFFSITE_INTERVAL_SECONDS:-3600}
      # The "offsite" rclone remote, configured entirely from the environment. Only the variables
      # your backend needs must be set; empty ones are ignored by rclone. Examples in .env.example.
      RCLONE_CONFIG_OFFSITE_TYPE: ${RCLONE_CONFIG_OFFSITE_TYPE:-}
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${RCLONE_CONFIG_OFFSITE_PROVIDER:-}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${RCLONE_CONFIG_OFFSITE_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${RCLONE_CONFIG_OFFSITE_REGION:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_ACCOUNT: ${RCLONE_CONFIG_OFFSITE_ACCOUNT:-}
      RCLONE_CONFIG_OFFSITE_KEY: ${RCLONE_CONFIG_OFFSITE_KEY:-}
      RCLONE_CONFIG_OFFSITE_HOST: ${RCLONE_CONFIG_OFFSITE_HOST:-}
      RCLONE_CONFIG_OFFSITE_USER: ${RCLONE_CONFIG_OFFSITE_USER:-}
      RCLONE_CONFIG_OFFSITE_PASS: ${RCLONE_CONFIG_OFFSITE_PASS:-}
    volumes:
      - ./config/backup:/scripts:ro
      - ./backups:/backups
    restart: unless-stopped

  prometheus:
    profiles:
      - observability
    image: prom/prometheus:v3.16.0
    container_name: backend-funeraria-prometheus
    depends_on:
      app:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./config/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/observability/prometheus/alerts:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus

  alertmanager:
    profiles:
      - observability
    image: prom/alertmanager:v0.34.2
    container_name: backend-funeraria-alertmanager
    # Alertmanager cannot expand environment variables itself (there is no --config.expand-env
    # flag; the previous setup passing it made the container exit at startup). entrypoint.sh
    # renders the ${ALERTMANAGER_*} placeholders of alertmanager.yml from the environment below
    # and then execs Alertmanager, so SMTP credentials are never committed in the YAML.
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    command:
      - --storage.path=/alertmanager
    environment:
      ALERTMANAGER_SMTP_HOST: ${ALERTMANAGER_SMTP_HOST:-smtp.gmail.com}
      ALERTMANAGER_SMTP_PORT: ${ALERTMANAGER_SMTP_PORT:-587}
      ALERTMANAGER_SMTP_USER: ${ALERTMANAGER_SMTP_USER:-alerts@example.com}
      ALERTMANAGER_SMTP_PASSWORD: ${ALERTMANAGER_SMTP_PASSWORD:-}
      ALERTMANAGER_SMTP_FROM: ${ALERTMANAGER_SMTP_FROM:-alerts@example.com}
      ALERTMANAGER_EMAIL_TO: ${ALERTMANAGER_EMAIL_TO:-alerts@example.com}
      # Dead-man's switch ping URL (healthchecks.io / Better Stack). Empty = Watchdog not exported.
      ALERTMANAGER_WATCHDOG_URL: ${ALERTMANAGER_WATCHDOG_URL:-}
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./config/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./config/observability/alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - alertmanager_data:/alertmanager

  # OpenTelemetry Collector receives OTLP traffic from the app and forwards spans to Tempo.
  # Part of the base stack (no profile) so tracing export can stay on by default; it is small and
  # memory-capped (memory_limiter). Tempo itself only runs with the 'observability' profile, which
  # is why there is no depends_on on it. OTLP ports are bound to the host loopback only.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    container_name: backend-funeraria-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    mem_limit: 256m
    ports:
      - "127.0.0.1:${OTEL_COLLECTOR_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${OTEL_COLLECTOR_GRPC_PORT:-4317}:4317"
    volumes:
      - ./config/observability/otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro

  # Grafana Tempo stores traces locally on disk. Single-binary deployment, no cloud dependencies.
  tempo:
    profiles:
      - observability
    image: grafana/tempo:3.1.1
    container_name: backend-funeraria-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "${TEMPO_HTTP_PORT:-3200}:3200"
    volumes:
      - ./config/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo

  # Grafana Loki stores the application logs shipped by Alloy (7-day retention, filesystem).
  loki:
    profiles:
      - observability
    image: grafana/loki:3.7.9
    container_name: backend-funeraria-loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./config/observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki

  # Grafana Alloy tails the app container logs through the Docker socket (read-only) and pushes
  # them to Loki, promoting traceId / correlationId to structured metadata.
  alloy:
    profiles:
      - observability
    image: grafana/alloy:v1.21.3
    container_name: backend-funeraria-alloy
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    depends_on:
      loki:
        condition: service_started
    ports:
      - "${ALLOY_PORT:-12345}:12345"
    volumes:
      - ./config/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Prometheus textfile written by the db-backup service (backup_* metrics).
      - ./backups/metrics:/backup-metrics:ro

  grafana:
    profiles:
      - observability
    image: grafana/grafana:13.3.0
    container_name: backend-funeraria-grafana
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
      loki:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./config/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  app_storage:
  prometheus_data:
  alertmanager_data:
  tempo_data:
  grafana_data:
  loki_data:
