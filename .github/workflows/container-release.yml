name: Container Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional extra image tag, for example 1.2.3 or staging"
        required: false
        type: string
      publish_latest:
        description: "Also publish the latest tag"
        required: false
        default: false
        type: boolean

concurrency:
  group: container-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  packages: write
  security-events: write
  # Keyless signing: the job's OIDC token is exchanged for a short-lived Sigstore
  # certificate bound to this workflow, and the provenance lands in the repo attestations.
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Publish GHCR Image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Validate release ref
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] \
            && { [ "$GITHUB_REF_TYPE" != "branch" ] || [ "$GITHUB_REF_NAME" != "master" ]; }; then
            echo "Manual container releases must run from the master branch." >&2
            exit 1
          fi

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            git fetch --no-tags origin master
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
              echo "Release tags must point to commits reachable from master." >&2
              exit 1
            fi
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Prepare image metadata
        id: image
        shell: bash
        env:
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          INPUT_PUBLISH_LATEST: ${{ github.event.inputs.publish_latest }}
        run: |
          image_ref="$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA::12}"
          sha_tag="${image_ref}:sha-${short_sha}"
          primary_tag="$sha_tag"
          tags_file="$(mktemp)"

          printf "%s\n" "$sha_tag" >> "$tags_file"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            primary_tag="${image_ref}:${GITHUB_REF_NAME}"
            printf "%s\n" "$primary_tag" "${image_ref}:latest" >> "$tags_file"
          fi

          if [ -n "$INPUT_IMAGE_TAG" ]; then
            primary_tag="${image_ref}:${INPUT_IMAGE_TAG}"
            printf "%s\n" "$primary_tag" >> "$tags_file"
          fi

          if [ "$INPUT_PUBLISH_LATEST" = "true" ]; then
            printf "%s\n" "${image_ref}:latest" >> "$tags_file"
          fi

          {
            echo "image_ref=$image_ref"
            echo "primary_tag=$primary_tag"
            echo "tags<<EOF"
            sort -u "$tags_file"
            echo "EOF"
            echo "labels<<EOF"
            echo "org.opencontainers.image.title=backend-funeraria-app"
            echo "org.opencontainers.image.description=Backend API for funeral home operations"
            echo "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container smoke test
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image.outputs.primary_tag }}
        run: bash .github/scripts/container-smoke-test.sh

      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image.outputs.primary_tag }}
          artifact-name: backend-funeraria-app-sbom.spdx.json
          output-file: backend-funeraria-app-sbom.spdx.json
          format: spdx-json
          upload-artifact: true
          upload-release-assets: false

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.primary_tag }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif

      - name: Upload Trivy SARIF artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: ignore

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        shell: bash
        run: docker image push --all-tags "${{ steps.image.outputs.image_ref }}"

      # Everything below works on the pushed digest, never on a tag: a tag can be moved,
      # the digest is the image content.
      - name: Resolve pushed digest
        id: digest
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
          PRIMARY_TAG: ${{ steps.image.outputs.primary_tag }}
        run: |
          repo_digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$PRIMARY_TAG" \
            | grep "^${IMAGE_REF}@sha256:" | head -1)"
          if [ -z "$repo_digest" ]; then
            echo "Could not resolve the pushed digest for $PRIMARY_TAG." >&2
            exit 1
          fi
          {
            echo "digest=${repo_digest#*@}"
            echo "ref=$repo_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image and attach the SBOM attestation
        shell: bash
        env:
          IMAGE_DIGEST_REF: ${{ steps.digest.outputs.ref }}
        run: |
          cosign sign --yes "$IMAGE_DIGEST_REF"
          cosign attest --yes --type spdxjson \
            --predicate backend-funeraria-app-sbom.spdx.json "$IMAGE_DIGEST_REF"

      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # The repository without a tag: the attestation is bound to the digest, and
          # push-to-registry stores it next to the image under that name.
          subject-name: ${{ steps.image.outputs.image_ref }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Summarize release
        if: always()
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
          PRIMARY_TAG: ${{ steps.image.outputs.primary_tag }}
          TAGS: ${{ steps.image.outputs.tags }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          {
            echo "## Container Release"
            echo ""
            echo "- Image: \`$IMAGE_REF\`"
            echo "- Primary tag: \`$PRIMARY_TAG\`"
            echo "- Digest: \`${DIGEST:-not pushed}\` (cosign signature, SBOM attestation, SLSA provenance)"
            echo "- Smoke test: Docker healthcheck passed before publishing"
            echo "- SBOM artifact: \`backend-funeraria-app-sbom.spdx.json\`"
            echo "- Trivy SARIF: \`trivy-results.sarif\`"
            echo ""
            echo "### Published Tags"
            echo "\`\`\`"
            echo "$TAGS"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
