name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - "feature/**"
      - "codex/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Guard source ignore patterns
        shell: bash
        run: bash .github/scripts/source-ignore-guard.sh

      - name: Run Maven verify
        # `-Pbdd` opts the Cucumber suite into Surefire; the runner has Docker available so
        # the underlying Postgres Testcontainers fixture starts cleanly. Locally without
        # Docker the default profile keeps `mvn verify` green by skipping the BDD layer.
        run: mvn -q -Pbdd verify

      - name: Summarize verify results
        if: always()
        shell: bash
        run: |
          {
            echo "## Verify"
            echo ""
            echo "- Java: Temurin 25"
            echo "- Command: \`mvn -q -Pbdd verify\`"
            if [ -d target/site/jacoco ]; then
              echo "- JaCoCo report: available"
            else
              echo "- JaCoCo report: not generated"
            fi
            if [ -d target/surefire-reports ]; then
              echo "- Surefire reports: available"
            else
              echo "- Surefire reports: not generated"
            fi
            if [ -f target/checkstyle-result.xml ]; then
              echo "- Checkstyle report: available"
            else
              echo "- Checkstyle report: not generated"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore

      - name: Upload Checkstyle report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml
          if-no-files-found: ignore

  observability-config:
    name: Observability config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Same image versions the docker-compose observability profile runs, so a rule or
      # routing change that would break the local stack fails the PR instead.
      - name: Validate Prometheus rules
        run: |
          docker run --rm -v "$PWD/config/observability/prometheus:/p:ro" \
            --entrypoint promtool prom/prometheus:v3.16.0 \
            check rules /p/alerts/backend-funeraria-alerts.yml /p/alerts/backend-funeraria-business-alerts.yml

      - name: Unit-test alert rules
        run: |
          docker run --rm -v "$PWD/config/observability/prometheus:/p:ro" -w /p/tests \
            --entrypoint promtool prom/prometheus:v3.16.0 \
            test rules business-alerts.test.yml tracing-alerts.test.yml backup-offsite-alerts.test.yml

      - name: Validate Alertmanager config
        run: |
          # Render the template with the real entrypoint.sh (same logic as the container), once
          # with the Watchdog heartbeat disabled and once enabled, then check each rendering and
          # assert where the Watchdog alert is routed.
          am=config/observability/alertmanager
          render() {
            docker run --rm -v "$PWD/$am:/cfg:ro" -e ALERTMANAGER_TEMPLATE=/cfg/alertmanager.yml \
              -e ALERTMANAGER_SMTP_HOST=smtp.example.com -e ALERTMANAGER_SMTP_PORT=587 \
              -e ALERTMANAGER_SMTP_USER=ci@example.com -e ALERTMANAGER_SMTP_PASSWORD=x \
              -e ALERTMANAGER_SMTP_FROM=ci@example.com -e ALERTMANAGER_EMAIL_TO=ci@example.com \
              -e ALERTMANAGER_WATCHDOG_URL="$1" \
              --entrypoint /bin/sh prom/alertmanager:v0.34.2 /cfg/entrypoint.sh --render-only
          }
          check() {
            docker run --rm -v "$1:/am.yml:ro" --entrypoint amtool prom/alertmanager:v0.34.2 check-config /am.yml
            got=$(docker run --rm -v "$1:/am.yml:ro" --entrypoint amtool prom/alertmanager:v0.34.2 \
              config routes test --config.file=/am.yml alertname=Watchdog severity=none)
            echo "Watchdog -> $got (expected $2)"
            [ "$got" = "$2" ]
          }
          render "" > /tmp/am-off.yml
          render "https://hc-ping.com/00000000-0000-0000-0000-000000000000" > /tmp/am-on.yml
          check /tmp/am-off.yml null
          check /tmp/am-on.yml watchdog-heartbeat

      - name: Validate Grafana dashboards are valid JSON
        run: |
          for f in config/observability/grafana/provisioning/dashboards/json/*.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "Invalid JSON: $f"; exit 1; }
          done

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        id: docker-build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          tags: backend-funeraria-app:ci
          push: false
          load: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container smoke test
        shell: bash
        env:
          IMAGE_TAG: backend-funeraria-app:ci
        run: bash .github/scripts/container-smoke-test.sh

      - name: Summarize Docker build
        if: always()
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.docker-build.outputs.digest }}
        run: |
          {
            echo "## Docker Build"
            echo ""
            echo "- Dockerfile: \`Dockerfile\`"
            echo "- Tag: \`backend-funeraria-app:ci\`"
            echo "- Buildx cache: \`type=gha\`"
            echo "- Smoke test: Docker healthcheck against the built image"
            if [ -n "$IMAGE_DIGEST" ]; then
              echo "- Image digest: \`$IMAGE_DIGEST\`"
            else
              echo "- Image digest: not exported"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
