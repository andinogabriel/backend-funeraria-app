  /api/v1/metrics/dashboard:
    get:
      tags: [Metrics]
      summary: Snapshot de KPIs para el dashboard
      description: |
        Devuelve los cuatro indicadores que la consola muestra en el bento del dashboard:
        afiliados activos, planes activos, servicios registrados en el mes en curso y
        eventos auditados en las ultimas 24 horas. Cada metrica incluye el valor actual,
        el porcentaje de variacion respecto del periodo anterior (cuando es computable) y
        una serie corta de buckets para el sparkline asociado.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
      responses:
        '200':
          description: Snapshot de indicadores.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardMetricsResponseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/v1/metrics/dashboard/series:
    get:
      tags: [Metrics]
      summary: KPI recalculado para un rango seleccionable
      description: |
        Recalcula un unico indicador temporal (`SERVICES`, `PURCHASES` o `AUDIT`) sobre una
        ventana rodante elegida por el operador (`DAY`, `WEEK`, `MONTH`, `YEAR`). Respalda el
        selector de rango por card del dashboard: al cambiar la ventana de "Servicios" a un
        rango anual, el front llama a este endpoint en lugar de recargar todo el snapshot. La
        ventana es semiabierta `[inicio, fin)` terminando al final del dia de hoy; el trend
        compara contra la ventana inmediatamente anterior del mismo largo y el sparkline parte
        la ventana en 8 buckets ordenados de mas viejo a mas nuevo.
      security:
        - bearerAuth: []
      parameters:
        - name: metric
          in: query
          required: true
          schema:
            type: string
            enum: [SERVICES, PURCHASES, AUDIT]
          description: Indicador temporal a recalcular.
        - name: range
          in: query
          required: true
          schema:
            type: string
            enum: [DAY, WEEK, MONTH, YEAR]
          description: Ventana rodante (1 / 7 / 30 / 365 dias).
        - $ref: '#/components/parameters/XDeviceId'
      responses:
        '200':
          description: KPI recalculado para el rango pedido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiMetricDto'
        '400':
          $ref: '#/components/responses/ValidationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/v1/metrics/activity-feed:
    get:
      tags: [Metrics]
      summary: Feed de actividad reciente
      description: |
        Devuelve las entradas mas recientes del read model `activity_log`, alimentado por el
        consumidor `ActivityLogConsumer` del outbox (ADR-0014). Cada entrada describe un
        evento de dominio (alta / baja / actualizacion de afiliados o servicios) con una
        descripcion legible en castellano y la marca temporal en que se registro. El
        parametro `limit` esta acotado en el servidor: valores fuera de `[1, 100]` se
        normalizan, asi un cliente no puede solicitar la tabla entera.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
        - name: limit
          in: query
          required: false
          description: Cantidad maxima de entradas (entre 1 y 100). Por defecto 20.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Lista de entradas, las mas recientes primero.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityFeedResponseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/v1/metrics/trends:
    get:
      tags: [Metrics]
      summary: Tendencias mensuales del negocio
      description: |
        Serie mensual (mes mas antiguo primero, el ultimo es el mes en curso y es parcial) con
        servicios registrados y su facturacion, compras vigentes a proveedores, cuotas emitidas y
        cobranzas recibidas. Un mes sin movimientos se informa en cero para que el eje sea
        continuo. Las cobranzas se imputan al mes en que se pagaron, aunque cancelen periodos
        anteriores. Solo administradores, porque casi todas las series son financieras.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
        - name: months
          in: query
          required: false
          description: |
            Cantidad de meses, incluido el actual. Por defecto 12. Los valores fuera de
            `[3, 24]` no dan error: se ajustan al limite mas cercano.
          schema:
            type: integer
            default: 12
      responses:
        '200':
          description: Tendencias mensuales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyTrendsDto'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

