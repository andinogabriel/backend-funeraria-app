  /api/v1/membership/tariff/quote:
    get:
      tags: [Membership]
      summary: Cotizar cuota mensual
      description: |
        Cotiza la cuota mensual para una edad y un nivel de salud: `cuota = base *
        multiplicador_edad * multiplicador_salud`. Cuando la edad esta fuera del rango asegurable
        devuelve 200 con `insurable=false` y un `reason` (no es un error). Un `healthTier`
        desconocido devuelve 404.
      security:
        - bearerAuth: []
      parameters:
        - name: age
          in: query
          required: true
          schema: { type: integer }
          description: Edad del aspirante en anios.
        - name: healthTier
          in: query
          required: true
          schema: { type: string }
          description: Codigo del nivel de salud (ej. STANDARD, GRADED, SPECIAL).
        - $ref: '#/components/parameters/XDeviceId'
      responses:
        '200':
          description: Cotizacion (asegurable o no).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeQuoteResponseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

