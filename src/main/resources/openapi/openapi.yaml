  /api/v1/reports/daily:
    get:
      tags: [Reports]
      summary: Arqueo diario (conciliacion de caja)
      description: |
        Resume el movimiento de caja de un dia calendario para el cierre del operador:
        - `services` (entra plata): servicios funebres no eliminados con fecha en el dia,
          sumando `funeral.total_amount`.
        - `purchases` (sale plata): ingresos `ACTIVE` con fecha en el dia, sumando
          `incomes.total_amount`. Los asientos de reversion (anulacion, PR4) son filas
          `ACTIVE` con monto negativo, asi una compra anulada-y-revertida netea a cero en
          el total sin doble conteo; `annulledCount` informa cuantos originales se anularon
          ese dia sin distorsionar la cifra.
        - `net` = `services.total - purchases.total`.

        El dia de los servicios se bracketea en hora local; el de los ingresos en zona
        Argentina (UTC-3) convertida a instantes, igual que el filtro de fechas de Ingresos.
        Solo ADMIN.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
        - name: date
          in: query
          required: true
          description: Dia a conciliar en formato ISO-8601 (`yyyy-MM-dd`).
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Resumen del dia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyReportResponseDto'
        '400':
          $ref: '#/components/responses/ValidationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

