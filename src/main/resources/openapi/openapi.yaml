  /api/v1/items/{code}:
    get:
      tags: [Items]
      summary: Obtener item por codigo
      description: Solo ADMIN.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/ItemCodePath'
      responses:
        '200':
          description: Item encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    put:
      tags: [Items]
      summary: Actualizar item
      description: Solo ADMIN.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/ItemCodePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemRequestDto'
      responses:
        '200':
          description: Item actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponseDto'
        '400':
          $ref: '#/components/responses/ValidationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    delete:
      tags: [Items]
      summary: Eliminar item (soft-delete con guards)
      description: |
        Solo ADMIN. Marca el item como eliminado (`deletedAt` + `deletedBy`) sin
        removerlo físicamente: el codigo permanece reservado (sigue 409 contra
        re-creación con el mismo codigo) y la imagen asociada se conserva en el
        storage para que la papelera la muestre.

        Dos guardas se ejecutan antes del soft-delete y producen `409 Conflict`:
        - El item tiene `stock > 0`: el operador debe regularizar el inventario
          (anular ingreso, ajuste) antes de poder eliminarlo.
        - El item está referenciado por al menos un plan activo (los planes
          eliminados no cuentan): el operador debe quitar la referencia o
          eliminar el plan primero.

        Audit log: `ITEM_DELETED`. Outbox: `ItemDeleted`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/ItemCodePath'
      responses:
        '200':
          description: Operacion completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatusModel'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/v1/items/deleted:
    get:
      tags: [Items]
      summary: Listar items soft-deleted (papelera, solo ADMIN)
      description: |
        Devuelve los items marcados como eliminados (`deletedAt is not null`)
        ordenados por fecha de borrado descendente. Surface de solo lectura —
        no existen acciones de restore ni purga en esta versión. Cada item
        incluye los campos `deletedAt` (ISO-8601 UTC) y `deletedBy` (email del
        admin que ejecutó el borrado).

        Filtros opcionales (combinación AND): `code` / `name` / `deletedBy`
        como substring case-insensitive; `categoryName` / `brandName` como
        exact match; `deletedFrom` / `deletedTo` como instantes UTC inclusivos
        sobre `deletedAt`.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
        - name: code
          in: query
          required: false
          schema: { type: string }
          description: Substring case-insensitive contra el codigo del item.
        - name: name
          in: query
          required: false
          schema: { type: string }
          description: Substring case-insensitive contra el nombre del item.
        - name: categoryName
          in: query
          required: false
          schema: { type: string }
          description: Exact match contra el nombre de la categoria vinculada.
        - name: brandName
          in: query
          required: false
          schema: { type: string }
          description: Exact match contra el nombre de la marca vinculada.
        - name: deletedBy
          in: query
          required: false
          schema: { type: string }
          description: Substring contra el email del admin que ejecutó el borrado.
        - name: deletedFrom
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Instante ISO-8601 UTC inclusivo (cota inferior de `deletedAt`).
        - name: deletedTo
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Instante ISO-8601 UTC inclusivo (cota superior de `deletedAt`).
        - $ref: '#/components/parameters/XDeviceId'
      responses:
        '200':
          description: Página de items eliminados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemPage'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/v1/items/category/{id}:
    get:
      tags: [Items]
      summary: Listar items por categoria
      description: Disponible para ADMIN y USER.
