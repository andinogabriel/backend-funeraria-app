      description: |
        Indica si la membresia del afiliado cubre el servicio a una fecha: requiere titular y nivel
        de salud, haber cumplido la carencia del nivel (salvo muerte accidental) y no superar las
        cuotas en mora toleradas. Informativo: no bloquea el alta de un servicio. Solo ADMIN.
      security:
