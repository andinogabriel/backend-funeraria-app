      description: Configuracion completa del tarifario de cuotas (settings + niveles + franjas).
      properties:
        baseAmount: { type: number, description: Monto base que escalan los multiplicadores. }
        maxIssueAge: { type: integer, description: Edad maxima de ingreso (sobre ella, no asegurable). }
        overdueGraceCount: { type: integer, description: Cuotas en mora toleradas antes de suspender el reclamo. }
        healthTiers:
          type: array
          items: { $ref: '#/components/schemas/HealthTierDto' }
        ageBands:
          type: array
          items: { $ref: '#/components/schemas/AgeBandDto' }
      required: [baseAmount, maxIssueAge, overdueGraceCount, healthTiers, ageBands]
    FeeQuoteResponseDto:
      type: object
      description: |
        Resultado de cotizar una cuota mensual. Cuando `insurable` es false, `monthlyFee`, la
        franja y la carencia son null y `reason` trae un codigo (ej. ABOVE_MAX_ISSUE_AGE,
        NO_AGE_BAND).
      properties:
        insurable: { type: boolean }
        monthlyFee: { type: number, nullable: true }
        age: { type: integer }
        ageBandLabel: { type: string, nullable: true }
        healthTierCode: { type: string }
        healthTierName: { type: string }
        waitingPeriodMonths: { type: integer, nullable: true }
        reason: { type: string, nullable: true }
      required: [insurable, age, healthTierCode, healthTierName]
    HealthTierUpdateDto:
      type: object
      description: Edicion de un nivel de salud (el `code` es inmutable y no se envia).
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        healthMultiplier: { type: number }
        waitingPeriodMonths: { type: integer }
      required: [id, name, healthMultiplier, waitingPeriodMonths]
    AgeBandUpdateDto:
      type: object
      description: Edicion de una franja etaria (solo multiplicador y etiqueta; las edades son fijas).
      properties:
        id: { type: integer, format: int64 }
        ageMultiplier: { type: number }
        label: { type: string }
      required: [id, ageMultiplier, label]
    TariffConfigUpdateDto:
      type: object
      description: Payload de edicion del tarifario. Actualiza filas existentes por id.
      properties:
        baseAmount: { type: number }
        maxIssueAge: { type: integer }
        overdueGraceCount: { type: integer }
        healthTiers:
          type: array
          items: { $ref: '#/components/schemas/HealthTierUpdateDto' }
        ageBands:
          type: array
          items: { $ref: '#/components/schemas/AgeBandUpdateDto' }
      required: [baseAmount, maxIssueAge, overdueGraceCount, healthTiers, ageBands]
    DashboardMetricsResponseDto:
      type: object
      description: Snapshot agregado de los KPIs renderizados en el dashboard operativo.
      properties:
        affiliatesActive:
          $ref: '#/components/schemas/KpiMetricDto'
        plansActive:
          $ref: '#/components/schemas/KpiMetricDto'
        funeralsThisMonth:
          $ref: '#/components/schemas/KpiMetricDto'
        purchasesThisMonth:
          $ref: '#/components/schemas/KpiMetricDto'
        criticalStock:
          $ref: '#/components/schemas/KpiMetricDto'
        auditedEvents24h:
          $ref: '#/components/schemas/KpiMetricDto'
      required: [affiliatesActive, plansActive, funeralsThisMonth, purchasesThisMonth, criticalStock, auditedEvents24h]
    DailyReportResponseDto:
      type: object
      description: |
        Arqueo diario: movimiento de caja de un dia calendario. `net` = `services.total -
        purchases.total`. Los asientos de reversion netean dentro de `purchases.total`
        (filas ACTIVE con monto negativo); `annulledCount` los informa aparte.
      properties:
        date:
          type: string
          format: date
          description: Dia conciliado (ISO-8601).
        services:
          $ref: '#/components/schemas/DailyReportServicesSummary'
        purchases:
          $ref: '#/components/schemas/DailyReportPurchasesSummary'
        net:
          type: number
          description: Movimiento neto del dia (`services.total - purchases.total`).
      required: [date, services, purchases, net]
    DailyReportServicesSummary:
      type: object
      description: Ingreso por servicios funebres del dia (funerales no eliminados).
      properties:
        count:
          type: integer
          format: int64
          description: Cantidad de funerales con fecha en el dia.
        total:
          type: number
          description: Suma de `total_amount` de esos funerales.
        lines:
          type: array
          description: Detalle por funeral que compone el total, mas reciente primero.
          items:
            $ref: '#/components/schemas/DailyReportServiceLine'
      required: [count, total, lines]
    DailyReportPurchasesSummary:
      type: object
      description: Egreso por compras a proveedores del dia (ingresos ACTIVE).
      properties:
        count:
          type: integer
          format: int64
          description: Cantidad de ingresos ACTIVE con fecha en el dia (incluye reversiones).
        total:
          type: number
          description: |
            Suma de `total_amount`; las reversiones aportan montos negativos, asi una
            compra anulada-y-revertida netea a cero.
        annulledCount:
          type: integer
          format: int64
          description: Cantidad de originales en estado ANNULLED con fecha en el dia.
        lines:
          type: array
          description: |
            Detalle por ingreso que compone el dia — originales ACTIVE, asientos de
            reversion (monto negativo) y originales ANNULLED — mas reciente primero.
          items:
            $ref: '#/components/schemas/DailyReportPurchaseLine'
      required: [count, total, annulledCount, lines]
    DailyReportServiceLine:
      type: object
      description: Un servicio funebre individual del detalle diario.
      properties:
        funeralId:
          type: integer
          format: int64
          description: Id del funeral, para enlazar a `/servicios/:id` desde el front.
        receiptNumber:
          type: string
          description: Numero de recibo del funeral (eg. `F-99121`).
        deceasedName:
          type: string
          description: Nombre completo del fallecido.
        planName:
          type: string
          nullable: true
          description: Nombre del plan vendido; `null` si el funeral no tiene plan asociado.
        amount:
          type: number
          description: '`total_amount` del funeral.'
      required: [funeralId, receiptNumber, deceasedName, amount]
    DailyReportPurchaseLine:
      type: object
      description: Una compra a proveedor individual del detalle diario.
      properties:
        receiptNumber:
          type: string
          description: Numero de recibo del ingreso.
        supplierName:
          type: string
          nullable: true
          description: Nombre del proveedor; `null` si el ingreso no tiene proveedor asociado.
        amount:
          type: number
          description: '`total_amount` del ingreso; negativo en los asientos de reversion.'
        status:
          type: string
          enum: [ACTIVE, ANNULLED]
          description: Estado de ciclo de vida del ingreso.
        reversal:
          type: boolean
          description: |
            `true` cuando la fila es un asiento de reversion (monto negativo, con back-pointer
            al original anulado).
      required: [receiptNumber, amount, status, reversal]
    ActivityFeedEntryDto:
      type: object
      description: |
        Entrada del feed de actividad reciente, proyectada desde el outbox por
        `ActivityLogConsumer`. `summary` es una descripcion en castellano lista para
        renderizar; el frontend usa `eventId` como clave estable de `trackBy`.
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
        aggregateType:
          type: string
        aggregateId:
          type: string
        summary:
          type: string
        occurredAt:
          type: string
          format: date-time
      required: [eventId, eventType, aggregateType, aggregateId, summary, occurredAt]
    ActivityFeedResponseDto:
      type: object
      description: Envoltura del feed; deja la puerta abierta a metadata futura.
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ActivityFeedEntryDto'
      required: [entries]
    MonthlyTrendPointDto:
      type: object
      description: Un mes calendario de las tendencias. Montos en pesos con dos decimales.
      properties:
        month:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}$'
          example: '2026-11'
        funerals:
          type: integer
          format: int64
          description: Servicios registrados en el mes, sin contar la papelera.
        funeralRevenue:
          type: number
          description: Suma de los totales de esos servicios.
        purchases:
          type: number
          description: Compras a proveedores vigentes (sin anuladas ni sus contrasientos).
        duesBilled:
          type: number
          description: Cuotas emitidas con ese mes como periodo.
        duesCollected:
          type: number
          description: Pagos de cuotas recibidos durante el mes, cualquiera sea el periodo que cancelen.
      required: [month, funerals, funeralRevenue, purchases, duesBilled, duesCollected]
    MonthlyTrendsDto:
      type: object
      properties:
        asOf:
          type: string
          format: date
          description: Fecha para la que se calcularon las tendencias.
        points:
          type: array
          description: Un elemento por mes, del mas antiguo al actual, sin huecos.
          items:
            $ref: '#/components/schemas/MonthlyTrendPointDto'
      required: [asOf, points]
