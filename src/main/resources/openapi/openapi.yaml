  /api/v1/plans/deleted:
    get:
      tags: [Plans]
      summary: Listar planes soft-deleted (papelera, solo ADMIN)
      description: |
        Devuelve los planes marcados como eliminados (`deletedAt is not null`)
        ordenados por fecha de borrado descendente. Surface de solo lectura —
        no existen acciones de restore ni purga en esta versión. Cada item
        incluye los campos `deletedAt` (ISO-8601 UTC) y `deletedBy` (email del
        admin que ejecutó el borrado).

        Filtros opcionales (combinación AND): `name` / `deletedBy` como
        substring case-insensitive; `deletedFrom` / `deletedTo` como instantes
        UTC inclusivos sobre `deletedAt`.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
        - name: name
          in: query
          required: false
          schema: { type: string }
          description: Substring case-insensitive contra el nombre del plan.
        - name: deletedBy
          in: query
          required: false
          schema: { type: string }
          description: Substring contra el email del admin que ejecutó el borrado.
        - name: deletedFrom
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Instante ISO-8601 UTC inclusivo (cota inferior de `deletedAt`).
        - name: deletedTo
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Instante ISO-8601 UTC inclusivo (cota superior de `deletedAt`).
        - $ref: '#/components/parameters/XDeviceId'
      responses:
        '200':
          description: Página de planes eliminados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanPage'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
