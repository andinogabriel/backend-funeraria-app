    KpiMetricDto:
      type: object
      description: |
        Indicador individual que alimenta una tarjeta KPI del dashboard.
        `value` es siempre el valor actual; `trendPercent` puede ser `null` cuando no hay
        un periodo previo comparable (por ejemplo, planes no tiene marca de auditoria);
        `sparkline` es una serie corta (8 entradas) ordenada de mas antigua a mas reciente.
      properties:
        value:
          type: integer
          format: int64
          description: Valor actual de la metrica.
        trendPercent:
          type: number
          format: double
          nullable: true
          description: |
            Variacion porcentual respecto al periodo anterior, redondeada a un decimal.
            `null` cuando el periodo anterior es cero o no es computable.
        sparkline:
          type: array
          items:
            type: integer
            format: int64
          description: Serie de 8 buckets para el sparkline; vacio si la metrica no la soporta.
      required: [value, sparkline]
    ClientErrorRequestDto:
      type: object
      description: Error no capturado reportado por el navegador.
      properties:
        kind:
          type: string
          enum: [js, chunk_load, http]
        message:
          type: string
          maxLength: 300
        route:
          type: string
          pattern: '^/[A-Za-z0-9/:_\-]{0,119}$'
          description: Patron de ruta de Angular, ej. /afiliados/:id.
      required: [kind, message, route]
    WebVitalRequestDto:
      type: object
      description: Muestra de Core Web Vitals. Duraciones en ms; CLS sin unidad.
      properties:
        name:
          type: string
          enum: [CLS, FCP, INP, LCP, TTFB]
        value:
          type: number
          minimum: 0
          maximum: 600000
        rating:
          type: string
          enum: [good, needs-improvement, poor]
        route:
          type: string
          pattern: '^/[A-Za-z0-9/:_\-]{0,119}$'
      required: [name, value, rating, route]
    HealthTierDto:
      type: object
      description: Nivel de salud del tarifario de cuotas.
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, description: Clave de negocio inmutable (ej. STANDARD). }
        name: { type: string }
        healthMultiplier: { type: number, description: Multiplicador de cuota por salud. }
        waitingPeriodMonths: { type: integer, description: Carencia en meses para el reclamo. }
        displayOrder: { type: integer }
      required: [id, code, name, healthMultiplier, waitingPeriodMonths, displayOrder]
