  /api/v1/funerals/deleted:
    get:
      tags: [Funerals]
      summary: Listar funerales soft-deleted (papelera, solo ADMIN)
      description: |
        Devuelve los funerales marcados como eliminados (`deletedAt is not null`)
        ordenados por fecha de borrado descendente. Surface de solo lectura — no
        existen acciones de restore ni purga en esta versión. Cada item incluye
        los campos `deletedAt` (ISO-8601 UTC) y `deletedBy` (email del admin que
        ejecutó el borrado).

        Filtros opcionales (combinación AND): `deceasedName` / `dni` /
        `receiptNumber` / `deletedBy` como substring case-insensitive;
        `deletedFrom` / `deletedTo` como instantes UTC inclusivos sobre
        `deletedAt`.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
        - name: deceasedName
          in: query
          required: false
          schema: { type: string }
          description: Substring case-insensitive contra `firstName + ' ' + lastName` del fallecido.
        - name: dni
          in: query
          required: false
          schema: { type: string }
          description: Substring contra el DNI del fallecido castado a string.
        - name: receiptNumber
          in: query
          required: false
          schema: { type: string }
          description: Substring contra el número de recibo del servicio.
        - name: deletedBy
          in: query
          required: false
          schema: { type: string }
          description: Substring contra el email del admin que ejecutó el borrado.
        - name: deletedFrom
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Instante ISO-8601 UTC inclusivo (cota inferior de `deletedAt`).
        - name: deletedTo
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Instante ISO-8601 UTC inclusivo (cota superior de `deletedAt`).
        - $ref: '#/components/parameters/XDeviceId'
      responses:
        '200':
          description: Página de funerales eliminados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FuneralPage'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

