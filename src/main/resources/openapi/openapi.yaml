openapi: 3.1.0
info:
  title: Backend Funeraria App API
  version: 2.1.0
  description: |
    Contrato HTTP del monolito `backend-funeraria-app`.

    La API esta organizada por slices funcionales y documenta:
    - endpoints disponibles hoy en controllers reales
    - requests y responses con sus DTOs actuales
    - reglas de seguridad por JWT ligado a dispositivo
    - errores esperables por validacion, autorizacion y reglas de negocio

    Convenciones importantes:
    - Los endpoints autenticados requieren `Authorization: Bearer <token>`.
    - Los endpoints autenticados tambien requieren `X-Device-Id`.
    - `POST /api/v1/users/login` y `POST /api/v1/users/refresh` aceptan `Idempotency-Key`.
    - Toda mutacion autenticada (POST, PUT, PATCH, DELETE bajo `/api/`) acepta `Idempotency-Key`
      (8 a 100 caracteres `[A-Za-z0-9_-]`). La primera respuesta se guarda 24 h por usuario y clave:
      un reintento con la misma clave y el mismo request la repite con `Idempotency-Replayed: true`
      sin volver a ejecutar la operacion; si la primera sigue en curso responde 409 con
      `Idempotency-Status: in-progress`; la misma clave con otro request responde 422; una clave
      invalida responde 400. Un resultado 5xx libera la clave para poder reintentar.
    - Todas las respuestas incluyen `X-Trace-Id`; si el cliente envia `X-Correlation-Id`, la API lo propaga.
    - Los errores de negocio y validacion siguen el modelo `ProblemDetail`.
servers:
  - url: http://localhost:8081
    description: Entorno local
tags:
  - name: Authentication
    description: Registro, login, refresh, logout y activacion de cuenta.
  - name: Users
    description: Perfil del usuario autenticado, roles y datos de contacto.
  - name: Affiliates
    description: Gestion de afiliados.
  - name: Deceased
    description: Gestion de fallecidos.
  - name: Funerals
    description: Gestion de funerales.
  - name: Incomes
    description: Gestion de ingresos y compras.
  - name: Items
    description: Inventario y carga de imagenes.
  - name: Plans
    description: Planes funerarios.
  - name: Suppliers
    description: Gestion de proveedores.
  - name: Catalogs
    description: Catalogos de apoyo para formularios y reglas de negocio.
  - name: Metrics
    description: Indicadores agregados para el dashboard operativo.
  - name: Reports
    description: Reportes financieros de solo lectura (arqueo de caja). Solo ADMIN.
  - name: Membership
    description: Tarifario de cuotas de afiliacion (pricing por edad y salud).
paths:
  /api/v1/users:
    get:
      tags: [Users]
      summary: Listar usuarios
      description: Solo ADMIN. Devuelve todos los usuarios registrados ordenados por la regla actual del servicio.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
      responses:
        '200':
          description: Lista de usuarios.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    post:
      tags: [Authentication]
      summary: Registrar usuario
      description: Crea una cuenta nueva. El backend puede asignar roles, direcciones y telefonos iniciales.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterDto'
      responses:
        '201':
          description: Usuario creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDto'
        '400':
          $ref: '#/components/responses/ValidationResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Obtener usuario autenticado
      description: Devuelve el recurso HATEOAS del usuario autenticado con link `me`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
      responses:
        '200':
          description: Usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMeResource'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/v1/users/login:
    post:
      tags: [Authentication]
      summary: Iniciar sesion
      description: |
        Autentica por email y password y devuelve un access token JWT. El refresh token opaco viaja
        solo en la cookie `refresh_token` (HttpOnly, Secure, SameSite=Strict, Path=/api/v1/users),
        nunca en el body, para que el script de la pagina no pueda leerlo. La sesion queda ligada
        al dispositivo declarado en `deviceInfo`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginDto'
      responses:
        '200':
          description: Sesion iniciada correctamente.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenSetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwtDto'
        '400':
          $ref: '#/components/responses/ValidationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/v1/users/refresh:
    post:
      tags: [Authentication]
      summary: Rotar refresh token
      description: |
        Lee el refresh token de la cookie `refresh_token`, valida el dispositivo, rota el token
        (nueva cookie) y devuelve un access token nuevo.

        Deteccion de reuso: la rotacion recuerda el token reemplazado. Si ese token vuelve a
        presentarse dentro de la ventana de gracia (30 s por defecto) se responde 409
        `refresh.token.error.superseded`: es una carrera benigna entre pestanas y el cliente debe
        reintentar con la cookie que ya recibio. Pasada la ventana, quien lo presenta no es quien
        tiene el token nuevo: la sesion del dispositivo se cierra (refresh revocado, access tokens
        invalidados), se audita `REFRESH_TOKEN_REUSE_DETECTED` y se responde 401
        `refresh.token.error.reused`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: cookie
          name: refresh_token
          required: true
          schema:
            type: string
          description: Refresh token opaco emitido por login o por el refresh anterior.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequestDto'
      responses:
        '200':
          description: Tokens rotados correctamente.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenSetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwtDto'
        '400':
          $ref: '#/components/responses/ValidationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/v1/users/logout:
    put:
      tags: [Authentication]
      summary: Cerrar sesion
      description: |
        Invalida la sesion activa del dispositivo informado y expira la cookie `refresh_token`
        (el `Set-Cookie` se envia aunque el logout falle).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogOutRequestDto'
      responses:
        '200':
          description: Sesion invalidada.
          headers:
            Set-Cookie:
              description: "`refresh_token=; Max-Age=0; Path=/api/v1/users; HttpOnly; SameSite=Strict`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatusModel'
        '400':
          $ref: '#/components/responses/ValidationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/v1/users/activation:
    get:
      tags: [Authentication]
      summary: Confirmar cuenta
      description: Activa la cuenta usando el token de confirmacion.
      parameters:
        - name: token
          in: query
          required: true
          description: Token de activacion recibido por el usuario.
          schema:
            type: string
      responses:
        '200':
          description: Mensaje textual con el resultado del proceso.
          content:
            text/plain:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/v1/users/change-password:
    post:
      tags: [Users]
      summary: Cambiar password del usuario autenticado
      description: Requiere sesion valida. Cambia la password a partir de la password anterior.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetDto'
      responses:
        '200':
          description: Confirmacion del cambio de password.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        '400':
          $ref: '#/components/responses/ValidationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/v1/users/addresses-and-phones:
    get:
      tags: [Users]
      summary: Obtener direcciones y telefonos del usuario autenticado
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
      responses:
        '200':
          description: Direcciones y telefonos del usuario actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAddressAndPhoneDto'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/v1/users/rol/{email}:
    post:
      tags: [Users]
      summary: Agregar o actualizar rol de un usuario
      description: Solo ADMIN. Devuelve el set de roles actualizado del usuario.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/EmailPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolRequestDto'
      responses:
        '200':
          description: Roles actualizados.
          content:
            application/json:
              schema:
                type: array
                uniqueItems: true
                items:
                  $ref: '#/components/schemas/RolRequestDto'
        '400':
          $ref: '#/components/responses/ValidationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/v1/users/address:
    post:
      tags: [Users]
      summary: Reemplazar direcciones del usuario autenticado
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AddressRequestDto'
      responses:
        '200':
          description: Direcciones persistidas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AddressResponseDto'
        '400':
          $ref: '#/components/responses/ValidationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/v1/users/mobile-numbers:
    post:
      tags: [Users]
      summary: Reemplazar telefonos del usuario autenticado
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/MobileNumberRequestDto'
      responses:
        '200':
          description: Telefonos persistidos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MobileNumberResponseDto'
        '400':
          $ref: '#/components/responses/ValidationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/v1/affiliates:
    get:
      tags: [Affiliates]
      summary: Listar afiliados activos
      description: Solo ADMIN. Devuelve afiliados con `deceased=false`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
      responses:
        '200':
          description: Lista de afiliados activos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AffiliateResponseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    post:
      tags: [Affiliates]
      summary: Crear afiliado
      description: |
        Disponible para ADMIN y USER. Facturacion (ADR-0020): el titular se identifica por DNI
        (se crea o se reutiliza) y la cuota mensual se calcula con el tarifario a partir de la
        edad actual y `healthTierCode`. Un aspirante no asegurable (edad sobre el maximo de
        ingreso o sin franja) devuelve 409; un `healthTierCode` desconocido, 404.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AffiliateRequestDto'
      responses:
        '201':
          description: Afiliado creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateResponseDto'
        '400':
          $ref: '#/components/responses/ValidationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/v1/affiliates/search:
    get:
      tags: [Affiliates]
      summary: Buscar afiliados por nombre, apellido o DNI
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/SearchValueQuery'
      responses:
        '200':
          description: Resultado de busqueda.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AffiliateResponseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/v1/affiliates/deceased:
    get:
      tags: [Affiliates]
      summary: Listar afiliados historicos o fallecidos
      description: Solo ADMIN.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
      responses:
        '200':
          description: Lista historica.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AffiliateResponseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/v1/affiliates/deleted:
    get:
      tags: [Affiliates]
      summary: Listar afiliados soft-deleted (papelera, solo ADMIN)
      description: |
        Devuelve los afiliados marcados como eliminados (`deletedAt is not null`)
        ordenados por fecha de borrado descendente. Surface de solo lectura — no
        existen acciones de restore ni purga en esta versión. Cada item incluye
        los campos `deletedAt` (ISO-8601 UTC) y `deletedBy` (email del admin que
        ejecutó el borrado).

        Filtros opcionales (combinación AND): `firstName` / `lastName` / `dni` /
        `deletedBy` como substring case-insensitive; `deletedFrom` / `deletedTo`
        como instantes UTC inclusivos sobre `deletedAt`.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
        - name: firstName
          in: query
          required: false
          schema: { type: string }
          description: Substring case-insensitive contra el nombre del afiliado.
        - name: lastName
          in: query
          required: false
          schema: { type: string }
          description: Substring case-insensitive contra el apellido del afiliado.
        - name: dni
          in: query
          required: false
          schema: { type: string }
          description: Substring case-insensitive contra el DNI castado a string.
        - name: deletedBy
          in: query
          required: false
          schema: { type: string }
          description: Substring case-insensitive contra el email del admin que ejecutó el borrado.
        - name: deletedFrom
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Instante ISO-8601 UTC inclusivo (cota inferior de `deletedAt`).
        - name: deletedTo
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Instante ISO-8601 UTC inclusivo (cota superior de `deletedAt`).
        - $ref: '#/components/parameters/XDeviceId'
      responses:
        '200':
          description: Página de afiliados eliminados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliatePage'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/v1/affiliates/by-user:
    get:
      tags: [Affiliates]
      summary: Listar afiliados del usuario autenticado
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
      responses:
        '200':
          description: Afiliados asociados al usuario autenticado.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AffiliateResponseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/v1/affiliates/{dni}:
    put:
      tags: [Affiliates]
      summary: Actualizar afiliado
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/DniPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AffiliateRequestDto'
      responses:
        '200':
          description: Afiliado actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateResponseDto'
        '400':
          $ref: '#/components/responses/ValidationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    delete:
      tags: [Affiliates]
      summary: Eliminar afiliado
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/DniPath'
      responses:
        '200':
          description: Operacion completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatusModel'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/v1/brands:
    get:
      tags: [Catalogs]
      summary: Listar marcas
      description: Requiere autenticacion aunque no exija rol ADMIN.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
      responses:
        '200':
          description: Lista de marcas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BrandResponseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    post:
      tags: [Catalogs]
      summary: Crear marca
      description: Solo ADMIN.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandRequestDto'
      responses:
        '201':
          description: Marca creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandResponseDto'
        '400':
          $ref: '#/components/responses/ValidationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/v1/brands/{id}:
    get:
      tags: [Catalogs]
      summary: Obtener marca por id
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/LongIdPath'
      responses:
        '200':
          description: Marca encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandResponseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    put:
      tags: [Catalogs]
      summary: Actualizar marca
      description: Solo ADMIN.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/LongIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandRequestDto'
      responses:
        '200':
          description: Marca actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandResponseDto'
        '400':
          $ref: '#/components/responses/ValidationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    delete:
      tags: [Catalogs]
