      summary: Anular ingreso (asiento de reversion, solo ADMIN)
      description: |
        Anula el ingreso identificado por `id` y devuelve el asiento de reversion
        recien generado (cantidades negativas, mismas precios + items, nuevo recibo +
        serie, `reversalOfId` apuntando al original).

        Comportamiento atomico dentro de una sola transaccion: por cada detalle del
        original se decrementa el stock del item correspondiente, el original pasa a
        `status = ANNULLED`, y se persiste el asiento de reversion como una entrada
        contable independiente. Audit log: `INCOME_ANNULLED`. Outbox: `IncomeAnnulled`.

        Tres guardas devuelven 409:
        - El ingreso ya esta anulado (`income.error.annul.already.annulled`). La
          idempotencia es estricta — un segundo annul sobre el mismo id es un bug
          del cliente.
        - El target es un asiento de reversion
          (`income.error.annul.is.reversal`). Los reversiones son inmutables por
          contrato contable.
        - El stock disponible de algun item es menor a la cantidad recibida
          originalmente (`income.error.annul.insufficient.stock`). Anular una
          compra deshace un incremento pasado de stock; ir a negativo implicaria
          consumo fantasma que el flujo busca prevenir.

        El endpoint reemplaza al antiguo `DELETE /api/v1/incomes/{receiptNumber}`,
        que dejo de existir — ver el cambio en `IncomeCommandUseCase`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          description: Identificador del ingreso a anular (PK, no el numero de recibo).
      responses:
        '200':
          description: Asiento de reversion recien generado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeResponseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/v1/incomes/paginated:
    get:
      tags: [Incomes]
      summary: Listar ingresos paginados
      description: |
        Solo ADMIN. Expone la serializacion actual de `Page<IncomeResponseDto>` de Spring Data.
        Filtros opcionales por columna que se combinan con AND: `receiptNumber` (substring
        case-insensitive sobre el numero de recibo), `supplierNif` (match exacto del
        proveedor; el frontend lo alimenta desde un autocomplete que permite buscar por
        nombre y selecciona el NIF), `from` y `to` (rango inclusivo de `incomeDate` expandido
        a inicio/fin del dia).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/IsDeletedQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/SortByQuery'
        - $ref: '#/components/parameters/SortDirQuery'
        - name: receiptNumber
          in: query
          required: false
          description: Substring case-insensitive sobre el numero de recibo. Omitir o mandar vacio = sin filtro.
          schema:
            type: string
        - name: supplierNif
          in: query
          required: false
          description: NIF / CUIT exacto del proveedor.
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Fecha de inicio inclusive. Se expande al inicio del dia. Formato ISO `yyyy-MM-dd`.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Fecha de fin inclusive. Se expande al fin del dia. Formato ISO `yyyy-MM-dd`.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Pagina de ingresos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomePageResponse'
        '400':
          $ref: '#/components/responses/ValidationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

