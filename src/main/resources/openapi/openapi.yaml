      summary: Eliminar plan (soft-delete)
      description: |
        Solo ADMIN. Marca el plan como eliminado (`deletedAt` + `deletedBy`) sin
        removerlo físicamente — los funerales históricos que lo referencian
        siguen llevando el snapshot frozen al momento de la venta. La papelera
        (`GET /api/v1/plans/deleted`) sigue mostrando el registro para auditoría
        / consulta. Audit log: `PLAN_DELETED`. Outbox: `PlanDeleted`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/LongIdPath'
      responses:
        '200':
          description: Operacion completada.
