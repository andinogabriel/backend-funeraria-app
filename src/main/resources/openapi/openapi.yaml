      type: object
      description: Franja etaria del tarifario. `maxAge` null indica franja abierta.
      properties:
        id: { type: integer, format: int64 }
        minAge: { type: integer }
        maxAge: { type: integer, nullable: true }
        ageMultiplier: { type: number }
        label: { type: string }
        displayOrder: { type: integer }
      required: [id, minAge, ageMultiplier, label, displayOrder]
